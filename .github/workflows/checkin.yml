name: Telegram Auto Checkin (Alt)

concurrency:
  group: ${{ github.workflow }}

on:
  schedule:
    - cron: '12 23 * * *'
    - cron: '38 0 * * *'
    - cron: '24 1 * * *'
    - cron: '45 2 * * *'
    - cron: '2 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行 (无视吉时)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install telethon requests google-generativeai

      - name: Run Checkin Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          CHECK_IN_CONFIG: ${{ secrets.CHECK_IN_CONFIG }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          GH_REPO: ${{ github.repository }}
        run: |
          cat << 'EOF' > run_checkin.py
          import asyncio, json, os, random, re, datetime, smtplib, time, requests
          import google.generativeai as genai
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from email.mime.text import MIMEText
          from email.header import Header
          from email.utils import formataddr

          # ==========================================
          AC_TAG = "小号"
          FOCUS_PEER = "@qing_to"
          # ==========================================

          FALLBACK_KEYWORDS = ["签到", "打卡", "Check In", "Check-in", "Sign In", "领取", "Collect", "Bonus"]
          log_success, log_warn, log_fail, general_log = [], [], [], []

          def clean_text(text):
              return re.sub(r'[^\w\u4e00-\u9fff]+', '', text).lower()

          def sys_log(message):
              print(message)
              utc_now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
              general_log.append(f"[{utc_now.strftime('%H:%M:%S')}] {message}")

          def check_github_ledger(today_str, month_str):
              token, repo = os.environ.get('GH_TOKEN'), os.environ.get('GH_REPO')
              if not token or not repo: return False, None
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              api_url = f"https://api.github.com/repos/{repo}/issues"
              ledger_title = f"📅 签到账本 ({month_str})"
              try:
                  params = {"state": "open", "creator": "app/github-actions"}
                  resp = requests.get(api_url, headers=headers, params=params).json()
                  issue_number = next((i['number'] for i in resp if i['title'] == ledger_title), None)
                  if not issue_number:
                      create_resp = requests.post(api_url, headers=headers, json={"title": ledger_title, "body": "签到记录"}).json()
                      issue_number = create_resp.get('number')
                  
                  comments = requests.get(f"{api_url}/{issue_number}/comments?per_page=100", headers=headers).json()
                  if any(f"✅ {today_str}" in c['body'] for c in comments): return True, issue_number
                  return False, issue_number
              except: return False, None

          def write_github_ledger(issue_number, today_str):
              token, repo = os.environ.get('GH_TOKEN'), os.environ.get('GH_REPO')
              headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
              requests.post(f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments", headers=headers, json={"body": f"✅ {today_str} 任务已完成 ({AC_TAG})"})

          def send_email_report():
              try:
                  mail_user, mail_pass = os.environ.get('MAIL_USER'), os.environ.get('MAIL_PASS')
                  if not mail_user or not mail_pass: return
                  today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
                  focus_status, focus_emoji = "💤 未检测", "❔"
                  if any(FOCUS_PEER in s for s in log_success): focus_status, focus_emoji = "✅ 签到成功", "🐱"
                  elif any(FOCUS_PEER in s for s in log_warn): focus_status, focus_emoji = "⚠️ 异常", "🙀"
                  elif any(FOCUS_PEER in s for s in log_fail): focus_status, focus_emoji = "❌ 失败", "😿"

                  html_content = f"""
                  <div style="font-family:sans-serif; max-width:600px; border:1px solid #eee; padding:20px; border-radius:8px;">
                      <h2 style="color:#2c3e50; margin-top:0;">📅 每日战报 ({today})</h2>
                      <div style="background:#f4f6f7; padding:12px; border-radius:4px; margin-bottom:15px;">
                          <b>重点关注 ({FOCUS_PEER}):</b> {focus_emoji} {focus_status}
                      </div>
                      <div style="display:flex; gap:10px; margin-bottom:15px;">
                          <div style="flex:1; background:#e8f5e9; color:#2e7d32; padding:10px; text-align:center; border-radius:4px;">✅ 成功: {len(log_success)}</div>
                          <div style="flex:1; background:#fff3e0; color:#ef6c00; padding:10px; text-align:center; border-radius:4px;">⚠️ 异常: {len(log_warn)}</div>
                          <div style="flex:1; background:#ffebee; color:#c62828; padding:10px; text-align:center; border-radius:4px;">❌ 失败: {len(log_fail)}</div>
                      </div>
                      <div style="font-size:12px; line-height:1.6;">
                          {f"<b style='color:#c62828;'>❌ 失败:</b><br>{'<br>'.join(log_fail)}<br>" if log_fail else ""}
                          {f"<b style='color:#ef6c00;'>⚠️ 异常:</b><br>{'<br>'.join(log_warn)}<br>" if log_warn else ""}
                          {f"<b style='color:#2e7d32;'>✅ 成功:</b><br>{'<br>'.join(log_success)}" if log_success else ""}
                      </div>
                  </div>
                  """
                  msg = MIMEText(html_content, 'html', 'utf-8')
                  msg['From'] = formataddr(("Telegram管家", mail_user))
                  icon = "❌" if log_fail else ("⚠️" if log_warn else "✅")
                  msg['Subject'] = Header(f"TG战报 ({AC_TAG}) | {icon} 成功:{len(log_success)} 异常:{len(log_warn)} 失败:{len(log_fail)}", 'utf-8')
                  with smtplib.SMTP_SSL('smtp.qq.com', 465) as smtp:
                      smtp.login(mail_user, mail_pass)
                      smtp.sendmail(mail_user, [mail_user], msg.as_string())
              except Exception as e: print(f"📧 邮件报错: {e}")

          async def identify_captcha(client, peer, message):
              key = os.environ.get('GEMINI_API_KEY')
              if not key: return None
              try:
                  sys_log(f"📷 正在为 {peer} 识别图片验证码...")
                  path = await client.download_media(message.photo)
                  genai.configure(api_key=key)
                  model = genai.GenerativeModel('gemini-1.5-flash')
                  img = genai.upload_file(path=path)
                  response = model.generate_content([img, "图中是什么主要物体？仅回复一个名词，如：报纸、熊猫、马桶"])
                  keyword = response.text.strip().lower()
                  os.remove(path)
                  sys_log(f"🧠 AI 识图结果: {keyword}")
                  return keyword
              except Exception as e:
                  sys_log(f"❌ 识图失败: {e}"); return None

          async def click_button(client, peer, bot_msg, target):
              if not bot_msg.buttons: return False
              keyword = await identify_captcha(client, peer, bot_msg) if bot_msg.photo else None
              for row in bot_msg.buttons:
                  for btn in row:
                      text = clean_text(btn.text)
                      if clean_text(target) in text or (keyword and keyword in text) or any(clean_text(k) in text for k in FALLBACK_KEYWORDS):
                          await btn.click(); return btn.text
              return False

          async def main():
              try:
                  api_id, api_hash, session = int(os.environ['API_ID']), os.environ['API_HASH'], os.environ['SESSION']
                  configs = json.loads(os.environ['CHECK_IN_CONFIG'])
              except: sys_log("❌ 配置读取失败"); return

              now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
              is_force = os.environ.get('FORCE_RUN') == 'true'
              is_done, issue_num = check_github_ledger(now.strftime('%Y-%m-%d'), now.strftime('%Y-%m'))
              if is_done and not is_force: sys_log("🛑 今日已签，跳过。"); return

              await asyncio.sleep(random.randint(60, 600))
              async with TelegramClient(StringSession(session), api_id, api_hash, device_model="OnePlus PJZ110", system_version="ColorOS 16.0.2") as client:
                  random.shuffle(configs)
                  for index, item in enumerate(configs):
                      peer = item['peer']
                      if index > 0 and index % 5 == 0: await asyncio.sleep(random.randint(20, 40))
                      await asyncio.sleep(random.randint(5, 12))
                      for attempt in range(3):
                          try:
                              if not client.is_connected(): await client.connect()
                              await client.send_message(peer, item['message'])
                              if item.get('button'):
                                  await asyncio.sleep(random.randint(5, 10))
                                  found = False
                                  async for m in client.iter_messages(peer, limit=3):
                                      res = await click_button(client, peer, m, item['button'])
                                      if res: log_success.append(f"{peer}: 点击 [{res}]"); found = True; break
                                  if not found: log_warn.append(f"{peer}: 未找到按钮")
                              else: log_success.append(f"{peer}: 已发送")
                              break
                          except Exception as e:
                              if attempt == 2: log_fail.append(f"{peer}: {str(e)}")
                              await asyncio.sleep(10)

                  if issue_num: write_github_ledger(issue_num, now.strftime('%Y-%m-%d'))
                  send_email_report()

          if __name__ == '__main__': asyncio.run(main())
          EOF
          python run_checkin.py
